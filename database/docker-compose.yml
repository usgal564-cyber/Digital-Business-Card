version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: digital_card_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 2020
      POSTGRES_DB: digital_card_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: